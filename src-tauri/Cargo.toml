[package]
name = "orrery"
version = "0.3.0"
description = "Orrery — agent harness cockpit"
authors = ["arvelvale"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "orrery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：改写其他工具的 JSON 索引时保持原有键顺序
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5"
# 按字节子串预筛会话行（Codex 单行可达数 MB，且可能含非 UTF-8 片段）
memchr = "2"
# DSH 会话日志是逐次追加的多帧 zstd；解码器默认连续解多帧
zstd = "0.13"
# 删除会话时移到系统回收站
trash = "5"
# OpenCode 把会话存在 SQLite 里；bundled 自带 sqlite 源码，不依赖系统库
rusqlite = { version = "0.32", features = ["bundled"] }
# 本地模型代理：axum 提供 HTTP 面，reqwest 转发上游（rustls，不依赖系统 OpenSSL）
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
futures-util = { version = "0.3", default-features = false }

# 扫盘解析在 debug 下慢一个数量级（594MB 会话冷解析实测 10.6s）；
# 只给热路径依赖开优化，不拖慢其余依赖的增量编译
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

[profile.dev]
opt-level = 1

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
