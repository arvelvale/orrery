name: Release

# 打 tag 触发：git tag v0.1.1 && git push origin v0.1.1
# 产物先进草稿 release，四个平台都跑完后人工确认再发布
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            args: ""
          - os: macos-latest
            label: macOS (Apple silicon)
            args: "--target aarch64-apple-darwin"
          - os: macos-13
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            label: Linux x64
            args: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || matrix.os == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      # 22.04 而不是最新版：AppImage 链接的是构建机的 glibc，版本越低能跑的发行版越多
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Orrery __VERSION__"
          releaseBody: |
            Desktop builds for Windows, macOS and Linux.

            | Platform | File |
            |---|---|
            | Windows 10/11 x64 | `*-setup.exe` (recommended) or `*.msi` |
            | macOS Apple silicon | `*_aarch64.dmg` |
            | macOS Intel | `*_x64.dmg` |
            | Linux x64 | `*.AppImage` (portable) or `*.deb` |

            Nothing is code-signed, so each OS will warn on first launch:

            - **Windows** — SmartScreen: *More info → Run anyway*
            - **macOS** — Gatekeeper: right-click the app → *Open*, or `xattr -cr /Applications/Orrery.app`
            - **Linux** — `chmod +x` the AppImage before running it

            See the [README](https://github.com/arvelvale/orrery#readme) for what it does.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}
